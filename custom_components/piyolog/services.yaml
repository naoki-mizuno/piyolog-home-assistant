add_baby_food:
  name: Add Solid Food Event
  description: Register a solid (baby) food event to PiyoLog
  fields:
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_meal:
  name: Add Meal Event
  description: Register a meal event to PiyoLog
  fields:
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_snack:
  name: Add Snack Event
  description: Register a snack event to PiyoLog
  fields:
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_drink:
  name: Add Drink Event
  description: Register a drink (water, tea, juice) event to PiyoLog
  fields:
    amount:
      name: Amount (ml)
      description: Amount drunk in milliliters (optional)
      example: 50
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: ml
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_temperature:
  name: Add Body Temperature Event
  description: Register a body temperature measurement
  fields:
    temperature:
      name: Temperature
      description: Body temperature in degrees Celsius
      example: 36.8
      required: true
      selector:
        number:
          min: 30
          max: 45
          step: 0.1
          unit_of_measurement: "°C"
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_height:
  name: Add Height Event
  description: Register a height measurement
  fields:
    height:
      name: Height
      description: Body height in centimeters
      example: 60.5
      required: true
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          unit_of_measurement: cm
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_weight:
  name: Add Weight Event
  description: Register a weight measurement
  fields:
    weight:
      name: Weight
      description: Body weight, in the unit selected below
      example: 5.2
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    unit:
      name: Unit
      description: Unit the weight is given in (PiyoLog also shows it in this unit)
      example: kg
      default: kg
      selector:
        select:
          options:
            - label: "Kilograms (kg)"
              value: "kg"
            - label: "Grams (g)"
              value: "g"
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_head_circumference:
  name: Add Head Circumference Event
  description: Register a head circumference measurement
  fields:
