add_sleep:
  name: Add Sleep Event
  description: Register a sleep start event to PiyoLog
  fields:
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_wake_up:
  name: Add Wake Up Event
  description: Register a wake up event to PiyoLog
  fields:
    baby_id: *baby_id
    baby_index: *baby_index
