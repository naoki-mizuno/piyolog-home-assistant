  fields:
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_other:
  name: Add Other Event
  description: Register an event that has no dedicated type
  fields:
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_custom:
  name: Add Custom Event
  description: Register one of the ten custom events configured in PiyoLog
  fields:
    number:
      name: Custom Event Number
      description: Which of the ten custom events configured in PiyoLog to log
      example: 1
      required: true
      selector:
        number:
          min: 1
          max: 10
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

delete_most_recent_event:
  name: Delete Most Recent Event
  description: >-
    Soft-delete the most recently registered event (by registration time, not
    event datetime). Refuses to delete events older than the configured guard.
  fields:
    event_type:
      name: Event Types
      description: >-
        Restrict deletion to one or more of these event types (default: any).
      example: "['pee', 'poo']"
      selector:
        select:
          multiple: true
          options:
            - label: "Pee"
              value: "pee"
            - label: "Poo"
              value: "poo"
            - label: "Sleep"
              value: "sleep"
            - label: "Wake Up"
              value: "wake_up"
            - label: "Breastfeeding"
              value: "breastfeeding"
            - label: "Milk"
              value: "milk"
            - label: "Expressed Breast Milk"
              value: "expressed_milk"
            - label: "Pumping"
              value: "pumping"
            - label: "Solid Food"
              value: "baby_food"
            - label: "Meal"
              value: "meal"
            - label: "Snack"
              value: "snack"
            - label: "Drink"
              value: "drink"
            - label: "Body Temperature"
              value: "body_temperature"
            - label: "Height"
              value: "height"
            - label: "Weight"
              value: "weight"
            - label: "Head Circumference"
              value: "head_circumference"
            - label: "Chest Circumference"
              value: "chest_circumference"
            - label: "Cough"
              value: "cough"
            - label: "Vomit"
              value: "vomit"
            - label: "Rash"
              value: "rash"
            - label: "Injury"
              value: "injury"
            - label: "Medicine"
              value: "medicine"
            - label: "Hospital"
              value: "hospital"
            - label: "Vaccine"
              value: "vaccine"
            - label: "Bath"
              value: "bath"
            - label: "Walk"
              value: "walk"
            - label: "Milestone"
              value: "milestone"
            - label: "Note"
              value: "memo"
            - label: "Other"
              value: "other"
            - label: "Custom 1"
              value: "custom1"
            - label: "Custom 2"
              value: "custom2"
            - label: "Custom 3"
              value: "custom3"
            - label: "Custom 4"
              value: "custom4"
            - label: "Custom 5"
              value: "custom5"
            - label: "Custom 6"
              value: "custom6"
            - label: "Custom 7"
              value: "custom7"
            - label: "Custom 8"
              value: "custom8"
            - label: "Custom 9"
              value: "custom9"
            - label: "Custom 10"
              value: "custom10"
    max_age_minutes:
      name: Max Age (minutes)
      description: >-
        Refuse to delete if the candidate event was registered more than this
        many minutes ago. Guard against accidental deletion of older entries.
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 180
          unit_of_measurement: min
    sync_before_check:
      name: Sync Before Check
      description: >-
        Fetch the latest data from PiyoLog before searching for the most recent
        event. Ensures events registered by other devices are visible. Disable
        if you want to avoid the extra network round-trip.
      default: true
      selector:
        boolean:
    baby_id:
      name: Baby ID
      description: Restrict to events for this baby (optional).
      example: "abc123def456"
      selector:
        text:
    baby_index:
      name: Baby Index
      description: Restrict to events for the baby at this 0-based index (optional).
      example: 0
      selector:
        number:
          min: 0
          max: 10

force_sync:
  name: Force Sync (Diagnostic)
  description: Manually trigger a sync with PiyoLog API to check for new events (for testing/debugging)
