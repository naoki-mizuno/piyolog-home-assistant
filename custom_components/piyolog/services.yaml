    memo: *memo

add_breastfeeding:
  name: Add Breastfeeding Event
  description: Register a breastfeeding event
  fields:
    breastfeeding_left_minutes:
      name: Left Breast (minutes)
      description: Left breast feeding duration in minutes
      example: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    breastfeeding_right_minutes:
      name: Right Breast (minutes)
      description: Right breast feeding duration in minutes
      example: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    breastfeeding_order:
      name: Feeding Order
      description: Which breast was used first
      example: "left_first"
      selector:
        select:
          options:
            - label: "Unspecified"
              value: "unspecified"
            - label: "Left to Right"
              value: "left_first"
            - label: "Right to Left"
              value: "right_first"
    amount:
      name: Amount (ml)
      description: Amount in ml (optional, for tracking expressed breast milk volume)
      example: 80
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: ml
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_milk:
  name: Add Milk Event
  description: Register a milk/formula feeding event
  fields:
    amount:
      name: Amount (ml)
      description: Amount of milk in milliliters
      default: 100
      example: 120
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: ml
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_expressed_milk:
  name: Add Expressed Breast Milk Event
  description: Register bottle-fed expressed breast milk
  fields:
    amount:
      name: Amount (ml)
      description: Amount of expressed breast milk fed, in milliliters
      example: 80
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: ml
    baby_id: *baby_id
    baby_index: *baby_index
    datetime: *datetime
    memo: *memo

add_pumping:
  name: Add Pumping Event
  description: Register how much breast milk was pumped
  fields:
    amount:
      name: Amount (ml)
      description: Amount of breast milk pumped, in milliliters
