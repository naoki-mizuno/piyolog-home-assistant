---
# piyolog.yaml のカスタムインテントを piyolog サービスに繋ぐ。
# configuration.yaml に次の行を足して読み込む:
#
#   intent_script: !include custom_sentences/ja/piyolog_intent_script.yaml
#
# すでに intent_script: がある場合は、このファイルの中身をそこに貼り付ける。

PiyologAddEvent:
  action:
    - service: "piyolog.add_{{ event }}"
      data:
        # datetime は piyolog.yaml の <datetime> 展開ルールが埋める（自由文、未指定なら omit）。
        # dateparser がパースするので「5分前」でも「昨日の20時」でも渡してよい。
        datetime: &relative_datetime "{{ datetime | default(omit) }}"
  speech:
    text: "記録しました"

PiyologAddPoo:
  action:
    - service: piyolog.add_poo
      data:
        # 指定がなければ default = ぴよログ側で「記録なし」
        poo_amount: "{{ poo_amount | default('default') }}"
        poo_hardness: "{{ poo_hardness | default('default') }}"
        poo_color: "{{ poo_color | default('default') }}"
        datetime: *relative_datetime
  speech:
    text: "うんちを記録しました"

PiyologAddAmount:
  action:
    - service: "piyolog.add_{{ event }}"
      data:
        amount: "{{ amount | int }}"
        datetime: *relative_datetime
  speech:
    text: "{{ amount }}ミリリットル記録しました"

PiyologAddBreastfeeding:
  action:
    - service: piyolog.add_breastfeeding
      data:
        breastfeeding_left_minutes: "{{ left | default(0) | int }}"
        breastfeeding_right_minutes: "{{ right | default(0) | int }}"
        breastfeeding_order: "{{ order | default('unspecified') }}"
        datetime: *relative_datetime
  speech:
    text: "母乳を記録しました"

PiyologAddTemperature:
  action:
    - service: piyolog.add_temperature
      data:
        temperature: "{{ temperature | float }}"
        datetime: *relative_datetime
  speech:
    text: "体温{{ temperature }}度を記録しました"

PiyologAddWeight:
  action:
    - service: piyolog.add_weight
      data:
        weight: "{{ weight | float }}"
        unit: "{{ unit }}"
        datetime: *relative_datetime
  speech:
    text: "体重を記録しました"

PiyologAddHeight:
  action:
    - service: piyolog.add_height
      data:
        height: "{{ height | float }}"
        datetime: *relative_datetime
  speech:
    text: "身長を記録しました"

PiyologAddCircumference:
  action:
    - service: "piyolog.add_{{ part }}_circumference"
      data:
        circumference: "{{ circumference | float }}"
        datetime: *relative_datetime
  speech:
    text: "記録しました"

PiyologAddWalk:
  action:
    - service: piyolog.add_walk
      data:
        duration_minutes: "{{ duration | int }}"
        datetime: *relative_datetime
  speech:
    text: "{{ duration }}分のさんぽを記録しました"

PiyologAddCustom:
  action:
    - service: piyolog.add_custom
      data:
        number: "{{ number | int }}"
        datetime: *relative_datetime
  speech:
    text: "カスタム{{ number }}を記録しました"

PiyologDeleteRecent:
  action:
    - service: piyolog.delete_most_recent_event
  speech:
    text: "直近の記録を取り消しました"

PiyologSync:
  action:
    - service: piyolog.force_sync
  speech:
    text: "ぴよログと同期しました"
